<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
  <div class="top-bar">
    <h1>Car List</h1>

    <form th:action="@{/}" method="get" class="search-form">
      <input type="text" name="search" placeholder="Search cars...">
      <button type="submit">Search</button>
    </form>

    <a th:href="@{/new}" class="btn add-btn">Add Car</a>
  </div>

  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Make</th>
        <th>Year</th>
        <th>License Plate Number</th>
        <th>Color</th>
        <th>Body Type</th>
        <th>Engine Type</th>
        <th>Transmission</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="car : ${cars}">
        <td th:text="${car.id}"></td>
        <td th:text="${car.make}"></td>
        <td th:text="${car.year}"></td>
        <td th:text="${car.licensePlateNumber}"></td>
        <td th:text="${car.color}"></td>
        <td th:text="${car.bodyType}"></td>
        <td th:text="${car.engineType}"></td>
        <td th:text="${car.transmission}"></td>
        <td>
          <a th:href="@{/car/{id}(id=${car.id})}" class="btn view">View</a>
          <a th:href="@{/edit(id=${car.id})}" class="btn edit">Edit</a>
          <a th:href="@{/delete(id=${car.id})}" class="btn delete">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
