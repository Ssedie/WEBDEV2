<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" th:replace="~{layout/main :: html(
    content=~{::main},
    docTitle=~{::title},
    customCss=~{::link}
)}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee</title>
</head>
<body>
<main>
  <div class="top-bar">
    <h1>Coffee List</h1>

    <form th:action="@{/}" method="get">
      <input type="text" name="search" placeholder="Search...">
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Make</th>
        <th>Year</th>
        <th>License/Plate Number</th>
        <th>Color</th>
        <th>Body Type</th>
        <th>Engine Type</th>
        <th>Transmission</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="car, stat : ${car}">
        <td>[[${stat.count}]]</td>
        <td th:text="${car.make}"></td>
        <td th:text="${car.year}"></td>
        <td th:text="${car.licensePlateNumber}"></td>
        <td th:text="${car.color}"></td>
        <td th:text="${car.bodyType}"></td>
        <td th:text="${car.engineType}"></td>
        <td th:text="${car.transmission}"></td>
        <td>
          <a th:href="@{/car/{id}(id=${car.id})}"  class="view">View</a>
          <a th:href="@{/edit(id=${car.id})}">Edit</a>
          <a th:href="@{/delete(id=${car.id})}">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
