<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<head>
    <title>Edit Coffee</title>
    <link rel="stylesheet" th:href="@{/css/create.css}">

</head>
<body>

<div class="form-container">
    <h1 th:text="'Edit ' + ${car.name}"></h1>
    <form th:action="@{/update}" method="post" th:object="${car}">
        <input type="hidden" th:field="*{id}"/>

        <div>
            <label for="name">Make</label>
            <input type="text" id="name" th:field="*{make}" th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"/>
            <p class="error" th:if="${#fields.hasErrors('make')}" th:errors="*{make}"></p>
        </div>

        <div>
            <label for="year">Year</label>
            <input type="text" id="year" th:field="*{year}" th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"/>
            <p class="error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></p>
        </div>

        <div>
            <label>Size</label>
            <select th:field="*{size}" id="size">
                <option th:each="size : ${sizes}" th:value="${size}" th:text="${size}"></option>
            </select>
        </div>

        <div>
            <label>Price</label>
            <input type="number" step="0.01" th:field="*{price}" placeholder="Price"/>
        </div>

        <div>
            <label>Roast Level</label>
            <select th:field="*{roastLevel}" id="roastLevel">
                <option th:each="roastLevel : ${roastLevels}" th:value="${roastLevel}" th:text="${roastLevel}"></option>
            </select>
        </div>

        <div>
            <label>Coffee Origin</label>
            <input type="text" th:field="*{origin}" placeholder="Origin"/>
        </div>

        <div>
            <label>Decaf</label>
            <input type="checkbox" th:field="*{decaf}" value="yes"/>
        </div>

        <div>
            <label>Stock</label>
            <input type="number" th:field="*{stock}" placeholder="Stock"/>
        </div>

        <div class="form-group">
            <div class="flavor-notes-container">
                <label>Flavor Notes (select all that apply):</label>
                <div>
                    <label for="edit-chocolate">Chocolate</label>
                    <input type="checkbox" name="flavorNotes" value="Chocolate" id="edit-chocolate"
                           th:checked="${#strings.contains(coffeeExam.flavorNotes, 'Chocolate')}">
                </div>
                <div>
                    <label for="edit-mint">Mint</label>
                    <input type="checkbox" name="flavorNotes" value="Mint" id="edit-mint"
                           th:checked="${#strings.contains(coffeeExam.flavorNotes, 'Mint')}">
                </div>
                <div>
                    <label for="edit-strawberry">Strawberry</label>
                    <input type="checkbox" name="flavorNotes" value="Strawberry" id="edit-strawberry"
                           th:checked="${#strings.contains(coffeeExam.flavorNotes, 'Strawberry')}">
                </div>
                <div>
                    <label for="edit-orange">Orange</label>
                    <input type="checkbox" name="flavorNotes" value="Orange" id="edit-orange"
                           th:checked="${#strings.contains(coffeeExam.flavorNotes, 'Orange')}">
                </div>
                <div>
                    <label for="edit-blueberry">Blueberry</label>
                    <input type="checkbox" name="flavorNotes" value="Blueberry" id="edit-blueberry"
                           th:checked="${#strings.contains(coffeeExam.flavorNotes, 'Blueberry')}">
                </div>
                <div>
                    <label for="edit-pineapple">Pineapple</label>
                    <input type="checkbox" name="flavorNotes" value="Pineapple" id="edit-pineapple"
                           th:checked="${#strings.contains(coffeeExam.flavorNotes, 'Pineapple')}">
                </div>
            </div>
        </div>

        <div>
            <label for="brewMethods">Brew Method</label>
            <select th:field="*{brewMethod}" id="brewMethods">
                <option th:each="method : ${brewMethods}" th:value="${method}" th:text="${method}"></option>
            </select>
        </div>

        <div class="action">
            <a th:href="@{/}" class="button-cancel">Cancel</a>
            <button>Update Coffee</button>
            <a href="/">Back to List</a>
        </div>
    </form>
</div>
</body>
</html>
