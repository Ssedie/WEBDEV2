<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD App</title>
  <script src="http://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap"
    rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    h1,
    h2 {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }

    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .neon-btn {
      background: linear-gradient(90deg, #22d3ee, #3b82f6);
      color: white;
      transition: 0.3s;
      font-weight: 500;
    }

    .neon-btn:hover {
      box-shadow: 0 0 15px #22d3ee;
      transform: scale(1.05);
    }

    table {
      margin-top: 1rem;
      border-spacing: 0 5px;
      border-collapse: separate;
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }

    tbody tr {
      transition: 0.2s;
    }

    tbody tr:hover {
      background: rgba(34, 211, 238, 0.08);
      cursor: pointer;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #22d3ee;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const apiUrl = "http://localhost:8000/api";

    function App() {
      const [jwtToken, setJwtToken] = useState(localStorage.getItem("jwtToken") || "");
      const [cars, setCars] = useState([]);
      const [editingCar, setEditingCar] = useState(null);
      const [formVisible, setFormVisible] = useState(false);
      const [showRegister, setShowRegister] = useState(false);

      function handleLogin(username, password) {
        fetch(apiUrl + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then(res => res.json())
          .then(data => {
            if (data.token) {
              localStorage.setItem("jwtToken", data.token);
              setJwtToken(data.token);
            } else {
              alert("Invalid credentials");
            }
          })
          .catch(() => alert("Login failed"));
      }

      function handleRegister(username, password) {
        fetch(apiUrl + "/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success || data.message === "User registered successfully") {
              alert("Registration successful!");
              setShowRegister(false);
            } else {
              alert(data.message || "Registration failed.");
            }
          })
          .catch(() => alert("Registration failed."));
      }

      function logout() {
        localStorage.removeItem("jwtToken");
        setJwtToken("");
      }

      function fetchCars() {
        fetch(apiUrl + "/cars", {
          headers: { Authorization: "Bearer " + jwtToken }
        })
          .then(res => res.json())
          .then(data => setCars(data))
          .catch(err => console.error(err));
      }

      function deleteCar(id) {
        fetch(apiUrl + "/cars/" + id, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + jwtToken }
        })
          .then(() => fetchCars())
          .catch(err => console.error(err));
      }

      function saveCar(carData) {
        const method = editingCar ? "PUT" : "POST";
        const url = editingCar
          ? apiUrl + "/cars/" + editingCar.id
          : apiUrl + "/cars";

        fetch(url, {
          method: method,
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + jwtToken
          },
          body: JSON.stringify(carData)
        })
          .then(() => {
            setFormVisible(false);
            setEditingCar(null);
            fetchCars();
          })
          .catch(err => console.error(err));
      }

      useEffect(() => {
        if (jwtToken) fetchCars();
      }, [jwtToken]);

      if (!jwtToken) {
        return showRegister
          ? <RegisterForm onRegister={handleRegister} onBack={() => setShowRegister(false)} />
          : <LoginForm onLogin={handleLogin} onSwitch={() => setShowRegister(true)} />;
      }

      return (
        <div>
          <div className="flex justify-between items-center mb-4">
            <h1 className="text-2xl text-cyan-400 font-bold">Car Management</h1>
            <div className="flex gap-2">
              <button className="neon-btn px-4 py-2 rounded-md" onClick={() => setFormVisible(true)}>Add New Car</button>
              <button onClick={logout} className="bg-gray-700 px-4 py-2 rounded-md text-white hover:bg-gray-800">Logout</button>
            </div>
          </div>

          <CarTable cars={cars} onDelete={deleteCar} onEdit={setEditingCar} />

          {formVisible && (
            <CarForm
              car={editingCar}
              onSave={saveCar}
              onClose={() => {
                setFormVisible(false);
                setEditingCar(null);
              }}
            />
          )}
        </div>
      );
    }

    function LoginForm({ onLogin, onSwitch }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");

      return (
        <div className="mt-10 glass w-80 mx-auto p-6 rounded-xl text-center">
          <h2 className="text-cyan-400 mb-4 text-xl font-bold">Login</h2>
          <input className="w-full bg-transparent border border-cyan-500 p-2 mb-2 rounded-md"
            type="text" placeholder="Username" value={username}
            onChange={(e) => setUsername(e.target.value)} />
          <input className="w-full bg-transparent border border-cyan-500 p-2 mb-4 rounded-md"
            type="password" placeholder="Password" value={password}
            onChange={(e) => setPassword(e.target.value)} />
          <button className="neon-btn px-4 py-2 rounded-md w-full" onClick={() => onLogin(username, password)}>Login</button>
          <p className="text-sm text-gray-400 mt-2">
            Don't have an account?{" "}
            <button onClick={onSwitch} className="text-cyan-400 underline">Register</button>
          </p>
        </div>
      );
    }

    function RegisterForm({ onRegister, onBack }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");

      function handleSubmit() {
        if (!username || !password || !confirm) return alert("Fill all fields");
        if (password !== confirm) return alert("Passwords don't match");
        onRegister(username, password);
      }

      return (
        <div className="mt-10 glass w-80 mx-auto p-6 rounded-xl text-center">
          <h2 className="text-cyan-400 mb-4 text-xl font-bold">Register</h2>
          <input className="w-full bg-transparent border border-cyan-500 p-2 mb-2 rounded-md"
            placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} />
          <input className="w-full bg-transparent border border-cyan-500 p-2 mb-2 rounded-md"
            type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} />
          <input className="w-full bg-transparent border border-cyan-500 p-2 mb-4 rounded-md"
            type="password" placeholder="Confirm Password" value={confirm} onChange={(e) => setConfirm(e.target.value)} />
          <button className="neon-btn px-4 py-2 rounded-md w-full mb-3" onClick={handleSubmit}>Register</button>
          <p className="text-sm text-gray-400">
            Already have an account?{" "}
            <button onClick={onBack} className="text-cyan-400 underline">Login</button>
          </p>
        </div>
      );
    }

    function CarTable({ cars, onDelete, onEdit }) {
      return (
        <table className="tableMain w-full border-collapse">
          <thead>
            <tr className="text-cyan-400 uppercase text-sm border-b border-gray-700">
              <th className="px-3 py-2">#</th>
              <th className="px-3 py-2">Make</th>
              <th className="px-3 py-2">Model</th>
              <th className="px-3 py-2">Year</th>
              <th className="px-3 py-2">License Plate</th>
              <th className="px-3 py-2">Color</th>
              <th className="px-3 py-2">Body Type</th>
              <th className="px-3 py-2">Engine Type</th>
              <th className="px-3 py-2">Transmission</th>
              <th className="px-3 py-2">Actions</th>
            </tr>
          </thead>
          <tbody className="text-gray-300 text-sm">
            {cars.map((car, i) => (
              <tr key={car.id}>
                <td>{i + 1}</td>
                <td>{car.make}</td>
                <td>{car.model}</td>
                <td>{car.year}</td>
                <td>{car.licensePlateNumber}</td>
                <td>{car.color}</td>
                <td>{car.bodyType}</td>
                <td>{car.engineType}</td>
                <td>{car.transmission}</td>
                <td>
                  <button className="text-cyan-400 mr-2" onClick={() => onEdit(car)}>Edit</button>
                  <button className="text-red-400" onClick={() => onDelete(car.id)}>Delete</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }

    function CarForm({ car, onSave, onClose }) {
      const [formData, setFormData] = useState(
        car || {
          make: "",
          model: "",
          year: "",
          licensePlateNumber: "",
          color: "",
          bodyType: "",
          engineType: "",
          transmission: "",
        }
      );

      function handleChange(e) {
        setFormData({ ...formData, [e.target.id]: e.target.value });
      }

      function handleSubmit(e) {
        e.preventDefault();
        onSave(formData);
      }

      return (
        <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center">
          <div className="glass p-6 rounded-xl w-96">
            <h2 className="text-cyan-400 text-xl mb-4 text-center">
              {car ? "Edit Car" : "Add New Car"}
            </h2>
            <form onSubmit={handleSubmit} className="space-y-3">
              {Object.keys(formData).map((key) => (
                <div key={key}>
                  <label className="block text-gray-400 capitalize">
                    {key.replace(/([A-Z])/g, " $1")}
                  </label>
                  <input
                    className="w-full bg-transparent border border-cyan-500 p-2 rounded-md"
                    id={key}
                    value={formData[key]}
                    onChange={handleChange}
                    required
                  />
                </div>
              ))}
              <div className="flex justify-between mt-4">
                <button type="button" onClick={onClose} className="bg-gray-600 px-4 py-2 rounded-md text-white hover:bg-gray-700">Cancel</button>
                <button type="submit" className="neon-btn px-4 py-2 rounded-md">Save</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
