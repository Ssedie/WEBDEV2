<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <title>To-Do-List</title>
  <script src="https://cdn.tailwindcss.com"></script>
     <style>
    .fade-in {
      opacity: 0;
      transform: translateY(6px);
      animation: fadeIn 0.25s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-out {
      opacity: 1;
      transform: translateY(0);
      animation: fadeOut 0.25s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(6px);
      }
    }
  </style>

</head>

<body class="bg-zinc-900 text-white min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md"></div>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('app'));

    function App() {
      const [tasks, setTasks] = React.useState([
        { id: 1, title: "Clean bedroom" },
        { id: 2, title: "Water plants" },
      ]);

      const [input, setInput] = React.useState("");
      const [nextId, setNextId] = React.useState(3);
      const [editingId, setEditingId] = React.useState(null);
      const [editText, setEditText] = React.useState("");

      function addTask(e) {
        e.preventDefault();
        const value = input.trim();
        if (!value) return;

        setTasks([...tasks, { id: nextId, title: value, animate: "fade-in" }]);
        setNextId(nextId + 1);
        setInput("");
      }

      function deleteTask(id) {
        
        setTasks(tasks.map(t => t.id === id ? { ...t, animate: "fade-out" } : t));

        setTimeout(() => {
          setTasks(tasks.filter(t => t.id !== id));
        }, 250);
      }

      function toggleTask(id) {
        deleteTask(id);
      }

      function editTask(task) {
        setEditingId(task.id);
        setEditText(task.title);
      }

      function saveEdit(id) {
        setTasks(tasks.map(t => t.id === id ? { ...t, title: editText } : t));
        setEditingId(null);
      }

      return (
        <div className="bg-zinc-800 p-6 rounded-lg shadow-xl fade-in">
          <h1 className="text-center text-xl font-semibold mb-4">To-Do-List</h1>

          {tasks.length === 0 ? (
            <div className="text-center text-zinc-400 mt-10 select-none">
              <div className="text-3xl mb-2 opacity-80">🗒️</div>
              <p className="text-sm opacity-70 mb-5">No tasks yet. Add one above.</p>
            </div>
          ) : (
            <ul className="space-y-3 mb-6">
              {tasks.map((task) => (
                <li
                  key={task.id}
                  className={`${task.animate || "fade-in"} flex items-center justify-between bg-zinc-700 px-3 py-2 rounded-md`}
                >
                  <input
                    type="checkbox"
                    onChange={() => toggleTask(task.id)}
                    className="mr-2 accent-green-400 cursor-pointer"
                  />

                  {editingId === task.id ? (
                    <div className="flex-1 flex gap-2">
                      <input
                        type="text"
                        value={editText}
                        onChange={(e) => setEditText(e.target.value)}
                        className="flex-1 bg-zinc-600 px-2 py-1 rounded outline-none"
                      />
                      <button
                        onClick={() => saveEdit(task.id)}
                        className="text-sm px-2 py-1 border border-green-400 rounded hover:bg-green-400 hover:text-black"
                      >
                        Save
                      </button>
                    </div>
                  ) : (
                    <div className="flex-1 flex items-center justify-between">
                      <span className="flex-1 select-none">{task.title}</span>
                      <button
                        onClick={() => editTask(task)}
                        className="text-xs px-2 py-1 border border-blue-400 rounded mr-2 hover:bg-blue-400 hover:text-black"
                      >
                        Edit
                      </button>
                    </div>
                  )}

                  <button
                    onClick={() => deleteTask(task.id)}
                    className="text-xs px-2 py-1 border border-red-400 rounded hover:bg-red-400 hover:text-black"
                  >
                    Delete
                  </button>
                </li>
              ))}
            </ul>
          )}

          <form onSubmit={addTask} className="flex gap-2">
            <input
              type="text"
              placeholder="Enter task"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              className="flex-1 bg-zinc-700 px-3 py-2 rounded outline-none"
            />
            <button
              type="submit"
              className="px-4 py-2 border border-white rounded hover:bg-white hover:text-black"
            >
              Add Task
            </button>
          </form>
        </div>
      );
    }

    root.render(<App />);
  </script>
</body>
</html>
